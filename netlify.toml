# Netlify deploy config.
#
# The site is static everywhere, but the Netlify build additionally runs the
# `@astrojs/netlify` adapter (ADR-0009) so the Keystatic admin (`/keystatic`)
# and its OAuth API (`/api/keystatic/*`) work as on-demand serverless routes.
# The adapter emits its own deploy config + functions under `.netlify/v1/`
# (the Netlify Frameworks API) at build time, so no `[functions]` block or
# redirects are needed here — Netlify auto-detects them. We only pin the build
# command and the static publish directory.
#
# GitHub Pages, by contrast, builds pure-static with NO adapter (see
# astro.config.mjs), so none of the above ships there.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
