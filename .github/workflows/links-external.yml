name: External link check

# External link rot is checked on a schedule (not per-PR) so flaky third-party
# hosts never block a merge. Opens an issue when something breaks.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_KIT_FORM_ID: ${{ vars.PUBLIC_KIT_FORM_ID }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Only http(s) links — internal base-path links are covered by the PR gate.
          # --root-dir lets lychee resolve the site's root-relative links
          # (/dominion-realm/...) to file:// paths, which the --scheme filter then
          # skips; without it every internal link errors as an unresolvable URL.
          args: --root-dir "${{ github.workspace }}/dist" --scheme https --scheme http --no-progress "dist/**/*.html"
          fail: false
      - name: Open issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: External link check found broken links
          content-filepath: ./lychee/out.md
          labels: link-rot
