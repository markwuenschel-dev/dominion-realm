name: External link check

# External link rot is checked on a schedule (not per-PR) so flaky third-party
# hosts never block a merge. Opens an issue when something breaks.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No version pin: action-setup reads `packageManager` from package.json
      # (single source of truth — same field corepack uses in the prod Dockerfile).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.{ts,tsx,js,jsx,md,mdx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-
      - run: pnpm run build
        env:
          # Passed through under their Astro-era names; the rename lives in
          # `scripts/lib/public-env.mjs` (see ci.yml).
          PUBLIC_KIT_FORM_ID: ${{ vars.PUBLIC_KIT_FORM_ID }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      - name: Start the site
        run: |
          pnpm exec next start &
          pnpm exec wait-on -t 60000 http://localhost:3000/
      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Crawl the running Next server and check only http(s) links — internal
          # routes resolve against the live origin, so no base-path mapping needed.
          args: --scheme https --scheme http --no-progress --include-fragments http://localhost:3000/
          fail: false
      - name: Open issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: External link check found broken links
          content-filepath: ./lychee/out.md
          labels: link-rot
