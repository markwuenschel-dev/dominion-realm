name: CI

# Validation gate for pull requests and for pushes to main (ADR-0012 — Next.js
# on AWS EC2). The `verify` job is what branch protection should require before
# merge; `a11y` is advisory for now. Production deploys are manual via
# `scripts/deploy.ps1` — this workflow does not deploy.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly (03:17 UTC) — drives the off-path `scene-joins` check only.
    # `verify`/`a11y` opt out of this event so the PR/push gate is unchanged.
    - cron: '17 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build & validate
    # PR/push/dispatch gate — never the nightly cron (that runs `scene-joins`).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Non-secret public IDs (repo Variables) so the build matches production.
      # The Variables keep their Astro-era names (PUBLIC_*); the app reads the
      # Next-era names (NEXT_PUBLIC_*), so the mapping happens here. Reading
      # `vars.NEXT_PUBLIC_*` silently yielded empty strings — see `id-wiring`.
      NEXT_PUBLIC_KIT_FORM_ID: ${{ vars.PUBLIC_KIT_FORM_ID }}
      NEXT_PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
      # No Variable exists yet: unset until the domain cutover (ADR-0012
      # follow-up). `src/lib/site.ts` falls back to the canonical URL.
      NEXT_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Assert the public IDs resolved
        # A misnamed repo Variable resolves to an empty string rather than
        # failing, so every build silently shipped without analytics or a
        # working signup action. Fail loudly instead. Skipped for fork PRs,
        # which do not receive repository variables.
        if: github.event.pull_request.head.repo.fork != true
        run: |
          missing=()
          [ -n "${NEXT_PUBLIC_GA4_ID}" ] || missing+=("PUBLIC_GA4_ID")
          [ -n "${NEXT_PUBLIC_KIT_FORM_ID}" ] || missing+=("PUBLIC_KIT_FORM_ID")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Repository Variable(s) missing or empty: ${missing[*]}."
            echo "Set them under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          echo "Public IDs resolved: GA4=${NEXT_PUBLIC_GA4_ID}, Kit form=${NEXT_PUBLIC_KIT_FORM_ID}"
      # No version pin: action-setup reads `packageManager` from package.json
      # (single source of truth — same field corepack uses in the prod Dockerfile).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, types, format, tests
        # Run the four checks in parallel but fail the job if ANY of them fails.
        # A bare `wait` returns 0 and would swallow the checks' exit codes, so
        # collect each PID and wait on it individually, tracking the worst status.
        run: |
          pids=()
          pnpm run format:check & pids+=($!)
          pnpm run lint & pids+=($!)
          pnpm run check & pids+=($!)
          pnpm test & pids+=($!)
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit $status
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.{ts,tsx,js,jsx,md,mdx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-
      - name: Build (Next.js)
        # `tsc --noEmit` runs above; the Zod content loader (src/lib/contentCore.ts,
        # re-exported by the server-only src/lib/content.ts shim) throws on a
        # malformed entry, so this build is the content-schema gate.
        run: pnpm run build
      - name: Upload build for a11y
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          retention-days: 1
          path: |
            .next/
            public/content-media/
            public/downloads/

  a11y:
    name: Accessibility (advisory)
    needs: verify
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Astro-era Variable names mapped to the Next-era env names (see `verify`).
      NEXT_PUBLIC_KIT_FORM_ID: ${{ vars.PUBLIC_KIT_FORM_ID }}
      NEXT_PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      # No version pin: action-setup reads `packageManager` from package.json
      # (single source of truth — same field corepack uses in the prod Dockerfile).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download build from verify
        uses: actions/download-artifact@v4
        with:
          name: next-build
      - name: Serve and audit
        # Advisory: report WCAG findings in the log without failing the check.
        # Remove `continue-on-error` to promote accessibility to a required gate
        # once the existing contrast issues are addressed.
        continue-on-error: true
        run: |
          pnpm exec next start &
          pnpm exec wait-on -t 60000 http://localhost:3000/
          pnpm exec pa11y-ci

  scene-joins:
    name: Scene-art joins (nightly / on-demand)
    # OFF the push/PR path by design: default CI stays network-free (ADR-0014).
    # This is the only job driven by the nightly `schedule`; it also runs on a
    # manual `workflow_dispatch`. It reaches the public Sanity dataset over the
    # network, so it must never gate a merge.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No version pin: action-setup reads `packageManager` from package.json
      # (single source of truth — same field corepack uses in the prod Dockerfile).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check live Scene-art joins
        # Diffs published Sanity `scene` docs against the git beat tree and fails
        # on an orphaned beatRef (scripts/check-scene-joins.ts). Queries the PUBLIC
        # production dataset (defaults zwq04v8v/production) with NO token — the
        # dataset is publicly readable, so no secret is set here.
        run: pnpm scene:check
