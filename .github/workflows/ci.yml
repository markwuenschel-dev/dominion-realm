name: CI

# Validation gate for every pull request (ADR-0010 — Next.js on Railway). The
# `verify` job is what branch protection should require before merge; `a11y` is
# advisory for now. Deployment is handled by Railway on push to `main`, not here.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Non-secret public IDs (repo Variables) so the build matches production.
      NEXT_PUBLIC_KIT_FORM_ID: ${{ vars.NEXT_PUBLIC_KIT_FORM_ID }}
      NEXT_PUBLIC_GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Types & content schema
        # `tsc --noEmit`; the Zod content loader (src/lib/content.ts) throws on a
        # malformed entry, so `next build` below is the real content-schema gate.
        run: npm run check
      - name: Build (Next.js)
        run: npm run build
      - name: Unit tests (Vitest)
        run: npm test

  a11y:
    name: Accessibility (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_KIT_FORM_ID: ${{ vars.NEXT_PUBLIC_KIT_FORM_ID }}
      NEXT_PUBLIC_GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Serve and audit
        # Advisory: report WCAG findings in the log without failing the check.
        # Remove `continue-on-error` to promote accessibility to a required gate
        # once the existing contrast issues are addressed.
        continue-on-error: true
        run: |
          npx next start &
          npx --yes wait-on -t 60000 http://localhost:3000/
          npx --yes pa11y-ci
