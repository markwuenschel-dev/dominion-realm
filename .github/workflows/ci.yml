name: CI

# Validation gate for pull requests and for pushes to main (ADR-0012 — Next.js
# on AWS EC2). The `verify` job is what branch protection should require before
# merge; `a11y` is advisory for now. Production deploys are manual via
# `scripts/deploy.ps1` — this workflow does not deploy.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Non-secret public IDs (repo Variables) so the build matches production.
      NEXT_PUBLIC_KIT_FORM_ID: ${{ vars.NEXT_PUBLIC_KIT_FORM_ID }}
      NEXT_PUBLIC_GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, types, format, tests
        # Run the four checks in parallel but fail the job if ANY of them fails.
        # A bare `wait` returns 0 and would swallow the checks' exit codes, so
        # collect each PID and wait on it individually, tracking the worst status.
        run: |
          pids=()
          pnpm run format:check & pids+=($!)
          pnpm run lint & pids+=($!)
          pnpm run check & pids+=($!)
          pnpm test & pids+=($!)
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit $status
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.{ts,tsx,js,jsx,md,mdx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-
      - name: Build (Next.js)
        # `tsc --noEmit` runs above; the Zod content loader (src/lib/content.ts)
        # throws on a malformed entry, so this build is the content-schema gate.
        run: pnpm run build
      - name: Upload build for a11y
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          retention-days: 1
          path: |
            .next/
            public/content-media/
            public/downloads/

  a11y:
    name: Accessibility (advisory)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_KIT_FORM_ID: ${{ vars.NEXT_PUBLIC_KIT_FORM_ID }}
      NEXT_PUBLIC_GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download build from verify
        uses: actions/download-artifact@v4
        with:
          name: next-build
      - name: Serve and audit
        # Advisory: report WCAG findings in the log without failing the check.
        # Remove `continue-on-error` to promote accessibility to a required gate
        # once the existing contrast issues are addressed.
        continue-on-error: true
        run: |
          pnpm exec next start &
          pnpm exec wait-on -t 60000 http://localhost:3000/
          pnpm exec pa11y-ci
