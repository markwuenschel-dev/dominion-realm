campaign_20260815_shipped:
  - candidate_id: CAND-37
    title: "Sanity readers besides getSiteCover throw instead of soft-failing"
    category: "Reliability"
    commit: f4bdcb9
    summary: >-
      CAND-19 soft-failed getSiteCover to null on a Sanity fetch reject, but
      getSocialImage/getRealmMap/getSubjectPrimaryMap/getSubjectCardMap still
      called sanityClient.fetch directly, so a down CMS could 500 those pages.
    landed: >-
      Extracted safeFetch<T>(reader, query, params, fallback) that logs and
      returns fallback on reject; all four remaining readers route through it
      (null for single images, [] for the two map readers), same policy as
      getSiteCover.
    evidence:
      - "src/sanity/media.ts:136-152 — safeFetch wrapper"
      - "src/sanity/media.ts:244-321 — getSocialImage/getRealmMap/getSubjectPrimaryMap/getSubjectCardMap routed through it"
      - "src/sanity/media.test.ts — reject-path coverage added"
    status: shipped

  - candidate_id: CAND-38
    title: "Zustand persist rehydration bypasses the sheet-import Zod gate"
    category: "Data / Schema / Contract"
    commit: 712e506
    summary: >-
      CAND-10 Zod-gated the JSON-import path into the character sheet store,
      but persist rehydration (localStorage -> store on load) merges its blob
      directly, spreading onto state and bypassing the same setters' clamps.
    landed: >-
      Added a persist `merge` option that runs the persisted state through
      parseSheetImport; a missing/invalid same-version blob keeps the current
      (default) state instead of applying unvalidated fields.
    evidence:
      - "src/store/characterSheetStore.ts:122-128 — merge: parseSheetImport(persistedState)"
      - "src/lib/sheetImport.ts:4-11 — doc comment names both external-input paths (CAND-10 + CAND-38)"
      - "src/store/characterSheetStore.test.ts — invalid species rejected, valid partial hydrates"
    status: shipped

