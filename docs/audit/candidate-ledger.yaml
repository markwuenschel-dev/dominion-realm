      rationale: >-
        Public /rss.xml is force-static with no per-reader reveal; a sealed title in an
        anonymous firehose is a leak, not discovery. B matches ADR-0004's public-metadata
        rule and the site's own sealed-everywhere-else precedent.
      verified: "route.ts GET() emits title+summary for all posts; header comment 'safe regardless of reveal tier' is false; journal [id]/page.tsx:26 returns {} for sealed via isUngated; all 5 journal posts are teaser today (latent contract debt, no live leak)."
